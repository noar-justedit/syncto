<?xml version="1.0" encoding="UTF-8"?>
<!--
  syncto — app icon
  Based on the "folder-sync" glyph from Lucide (ISC License).
  Drawn on the ingesto/renamo dark background with the violet accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b1d24"/>
      <stop offset="100%" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a880ff"/>
      <stop offset="55%"  stop-color="#8b6ff0"/>
      <stop offset="100%" stop-color="#35c98b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="222" fill="none"
        stroke="rgba(255,255,255,.08)" stroke-width="16"/>

  <!-- Lucide folder-sync, 24x24 viewport scaled x30 and centred -->
  <g transform="translate(152,152) scale(30)"
     fill="none" stroke="url(#stroke)" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v.5"/>
    <path d="M12 10v4h4"/>
    <path d="m12 14 1.535-1.605a5 5 0 0 1 8 1.5"/>
    <path d="M22 22v-4h-4"/>
    <path d="m22 18-1.535 1.605a5 5 0 0 1-8-1.5"/>
  </g>
</svg>
