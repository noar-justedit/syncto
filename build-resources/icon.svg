<?xml version="1.0" encoding="UTF-8"?>
<!--
  syncto - app icon (0.7.4, validated by Noar on 21.09.2026).

  The loop: two arcs chasing each other around the centre, white above, cyan
  #2cc4ea below - two places kept in step. The two gaps, left and right, are
  the two sides of a pair. No folder any more: projecto and renamo already
  draw one, and three folders in a Dock read as the same application.

  Family template: just edit lab black square, white drawing, ONE element in
  the application's colour. Shape 824 px on a 1024 canvas, corner radius 185
  (Apple template). The same cyan is the accent colour of the interface, on
  the logo and nowhere else.

  Styles are attributes, not a style block: qlmanage / rsvg / cairosvg and
  electron-builder all read attributes reliably.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000"/>
  <path d="M303.4 436.1 A222 222 0 0 1 677.0 363.5" fill="none" stroke="#ffffff" stroke-width="78" stroke-linecap="round"/>
  <path d="M739.4 307.2 L741.2 434.8 L614.6 419.7 Z" fill="#ffffff" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  <path d="M720.6 587.9 A222 222 0 0 1 347.0 660.5" fill="none" stroke="#2cc4ea" stroke-width="78" stroke-linecap="round"/>
  <path d="M284.6 716.8 L282.8 589.2 L409.4 604.3 Z" fill="#2cc4ea" stroke="#2cc4ea" stroke-width="22" stroke-linejoin="round"/>
</svg>
